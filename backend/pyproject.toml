[project]
name = "habla"
version = "0.1.0"
description = "Habla Practice — Spanish role-play voice agent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pipecat-ai[cartesia,anthropic,groq,silero,local-smart-turn]>=1.0",
    "anthropic>=0.45",
    "torch>=2.2",
    "torchaudio>=2.2",
]

# Runtime is Linux only (Fly + Docker dev). Mac hosts can't install Pipecat's
# VAD/smart-turn stack directly — we don't pretend the lock resolves there.
# `environments` restricts resolution to Linux so the lockfile is stable;
# `uv sync` on Mac will still fail at install time — use Docker for dev.
[tool.uv]
environments = ["sys_platform == 'linux'"]

# Keep torch CPU-only to avoid pulling ~2.7GB of NVIDIA CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.385",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habla"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
